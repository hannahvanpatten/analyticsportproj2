name: regenerate-derived-and-baselines

on:
  workflow_dispatch: {}

jobs:
  run-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run derived metrics
        run: python derived_metrics.py --input final_dataset.csv --output dataset_with_derived_metrics.csv

      - name: Run final validations (non-fatal)
        run: |
          python scripts/final_validations.py dataset_with_derived_metrics.csv || true

      - name: Run baselines
        run: python baseline_models_fixed.py

      - name: Commit generated artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset_with_derived_metrics.csv baseline_*.csv || true
          git commit -m "ci: regenerate derived dataset and baseline outputs (automated)" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push failed"
